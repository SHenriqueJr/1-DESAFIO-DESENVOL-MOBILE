<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBurguer | Lanchonete & Simulador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <!-- Botão Flutuante do Tema -->
    <button id="theme-toggle" class="btn-theme" onclick="alternarTema()">🌓 Alternar Tema</button>
    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="header-container">
            <h1>Burguers</h1>
            <p>Onde o seu gosto vira sabor! Lanches rápidos e personalizáveis.</p>
        </div>
    </header>

    <!-- Conteúdo do Simulador -->
        <!-- Layout Principal -->
    <div class="shop-container">
        
        <!-- Vitrine de Produtos Gerada Dinamicamente pelo JS -->
        <main class="products-section">
            <h2> Nosso Cardápio Dev</h2>
            <div id="products-grid" class="products-grid">
                <!-- O JavaScript vai injetar os hambúrgueres e bebidas aqui dentro automaticamente -->
            </div>
        </main>

        <!-- Barra Lateral do Carrinho -->
        <aside class="cart-aside">
            <h2>🛒 Meu Carrinho</h2>
            <div id="cart-items" class="cart-items-container">
                <p class="empty-message">Seu carrinho está vazio...</p>
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Total:</span>
                    <span id="cart-total" class="total-highlight">R$ 0,00</span>
                </div>
                <button class="btn-checkout" onclick="finalizarPedido()">Finalizar Pedido</button>
            </div>
        </aside>

    </div>


    <!-- Rodapé Oficial Exigido pelo Desafio -->
    <footer class="main-footer">
        <p>Desenvolvido por: S Henrique Jr | Trilha Desenvolvimento Mobile</p>
        <p class="footer-platform">Desafio 1 — Plataforma Mais Robotic</p>
    </footer>

    <!-- Script de Simulação -->
    <script src="script.js"></script>
</body>
</html>
