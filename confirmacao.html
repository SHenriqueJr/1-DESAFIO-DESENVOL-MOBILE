<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBurguer | Pedido Confirmado!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para a tela de sucesso */
        .success-container {
            max-width: 600px;
            margin: 4rem auto;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 6px solid var(--secondary);
        }
        .chef-gif {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-back {
            display: inline-block;
            background: var(--dark);
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-back:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>DevBurguer</h1>
    </header>

    <main class="success-container">
        <h2 style="color: var(--secondary);">Pedido Confirmado!</h2>
        <p style="margin-top: 0.5rem; color: #747d8c;">O seu combo dev já foi enviado direto para a cozinha.</p>
        
        <!-- Imagem/GIF interativo de um Chef cozinhando -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2NnMml2OXA5YTlyYjlyNHV0amxoNW1iNjkweDZjNWx2aHZxODlrOCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/102xzU5V7M1YOs/giphy.gif" 
        alt="Chef Cozinhando" class="chef-gif">

        <div>
            <a href="index.html" class="btn-back">⬅ Voltar para o Cardápio</a>
        </div>
    </main>

    <footer class="main-footer">
        <p>Desenvolvido por: S Henrique Jr | Trilha Desenvolvimento Mobile</p>
    </footer>

</body>
</html>
